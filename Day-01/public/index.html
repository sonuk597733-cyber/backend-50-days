
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>Create Account</h1>
      <p>Register your account</p>

      <form>
        <input
        id="username"
          type="text"
          name="username"
          placeholder="Username"
          required
        >

        <input
        id="email"
          type="email"
          name="email"
          placeholder="Email"
          required
        >

        <input
        id="password"
          type="password"
          name="password"
          placeholder="Password"
          required
        >

        <button type="submit">Register</button>
      </form>

      <div id="message"></div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
