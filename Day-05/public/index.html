<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">

    <h2>User Manager</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">All Users</a>
    </nav>

  </aside>


  <!-- ================= MAIN CONTENT ================= -->
  <main class="main-content">

    <!-- Header -->
    <header class="header">
      <h1>User Management</h1>
    </header>


    <!-- ================= REGISTER USER ================= -->
    <section class="register-section">

      <h2>Register New User</h2>

      <form id="registerForm">

        <div>
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
          >
        </div>

        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
          >
        </div>

        <button id="submit" type="submit">
          Register User
        </button>

      </form>

      <!-- Backend response -->
      <p id="registerMessage"></p>

    </section>


    <!-- ================= ALL USERS ================= -->
    <section class="users-section">

      <div class="users-header">

        <h2>All Users</h2>

        <input
          type="search"
          id="searchUser"
          placeholder="Search user..."
        >

      </div>


      <!-- Users will come from MongoDB -->
      <div id="usersContainer">

        <!-- Example user card/row -->
        <div class="user-card">

          <div class="user-info">
            <h3>Sonu Kumar</h3>
            <p>sonu@example.com</p>
          </div>

          <div class="user-actions">

            <button class="view-btn">
              View
            </button>

            <button class="edit-btn">
              Edit
            </button>

            <button class="delete-btn">
              Delete
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ================= USER PROFILE ================= -->
  <section
    id="profilePanel"
    class="profile-panel"
  >

    <button id="closeProfile">
      ×
    </button>

    <div class="profile-avatar">
      S
    </div>

    <h2 id="profileUsername">
      Sonu Kumar
    </h2>

    <p id="profileEmail">
      sonu@example.com
    </p>

    <div class="profile-details">

      <p>
        <strong>Username:</strong>
        <span id="profileName"></span>
      </p>

      <p>
        <strong>Email:</strong>
        <span id="profileUserEmail"></span>
      </p>

    </div>

  </section>


  <!-- ================= EDIT USER MODAL ================= -->
  <div
    id="editModal"
    class="modal"
  >

    <div class="modal-content">

      <h2>Edit User</h2>

      <form id="editForm">

        <div>
          <label for="editUsername">
            Username
          </label>

          <input
            type="text"
            id="editUsername"
            name="username"
          >
        </div>


        <div>
          <label for="editEmail">
            Email
          </label>

          <input
            type="email"
            id="editEmail"
            name="email"
          >
        </div>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelEdit"
          >
            Cancel
          </button>

          <button type="submit">
            Save Changes
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
